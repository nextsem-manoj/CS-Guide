<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Nextsem Academy</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#060c18" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #060c18;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 24px;
    }
    .logo-container {
      width: 88px;
      height: 88px;
      border-radius: 20px;
      background: linear-gradient(135deg, #0c1328 0%, #172554 100%);
      border: 1.5px solid rgba(4, 170, 109, 0.4);
      box-shadow: 0 10px 30px rgba(4, 170, 109, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
    }
    .logo-text {
      font-size: 32px;
      font-weight: 900;
      letter-spacing: -1px;
      background: linear-gradient(135deg, #c1a648 0%, #fef08a 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    h1 {
      font-size: 24px;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
    }
    p {
      font-size: 14px;
      color: #94a3b8;
      margin-bottom: 24px;
      max-width: 300px;
    }
    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(4, 170, 109, 0.2);
      border-top-color: #04AA6D;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .status {
      font-size: 13px;
      color: #04AA6D;
      font-weight: 600;
    }
    .retry-btn {
      display: none;
      margin-top: 16px;
      background: #04AA6D;
      color: #ffffff;
      border: none;
      padding: 10px 24px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="logo-container">
    <div class="logo-text">NS</div>
  </div>
  <h1>CSguide by Nextsem</h1>
  <p>Connecting to live learning platform...</p>
  <div class="spinner" id="spinner"></div>
  <div class="status" id="status">Loading...</div>
  <button class="retry-btn" id="retryBtn" onclick="location.href='https://ignou-study-notes-by-nextsem.web.app'">Retry Connection</button>

  <script>
    setTimeout(function() {
      if (navigator.onLine) {
        window.location.replace('https://ignou-study-notes-by-nextsem.web.app');
      } else {
        document.getElementById('spinner').style.display = 'none';
        document.getElementById('status').innerText = 'Offline: Please check your internet connection.';
        document.getElementById('status').style.color = '#f87171';
        document.getElementById('retryBtn').style.display = 'inline-block';
      }
    }, 1500);
  </script>
</body>
</html>
