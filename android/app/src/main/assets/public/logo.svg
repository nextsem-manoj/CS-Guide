<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <filter id="prism-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <linearGradient id="slash-prism" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="30%" stop-color="#ffffff" />
      <stop offset="65%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
    <linearGradient id="bracket-cyan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>

  <!-- Dark Container with Emerald Border -->
  <rect width="512" height="512" rx="100" fill="#060c18"/>
  <rect x="12" y="12" width="488" height="488" rx="88" fill="none" stroke="#04AA6D" stroke-width="14" stroke-opacity="0.8"/>

  <!-- Left Bracket < -->
  <path d="M 165 155 L 75 256 L 165 357" fill="none" stroke="url(#bracket-cyan)" stroke-width="48" stroke-linecap="round" stroke-linejoin="round" filter="url(#prism-glow)"/>

  <!-- Slash / with chromatic prism gradient -->
  <line x1="285" y1="125" x2="225" y2="387" stroke="url(#slash-prism)" stroke-width="52" stroke-linecap="round" filter="url(#prism-glow)"/>

  <!-- Right Bracket > -->
  <path d="M 347 155 L 437 256 L 347 357" fill="none" stroke="url(#bracket-cyan)" stroke-width="48" stroke-linecap="round" stroke-linejoin="round" filter="url(#prism-glow)"/>

  <!-- NextSem Subtitle Text -->
  <text 
    x="50%" 
    y="445" 
    dominant-baseline="middle" 
    text-anchor="middle" 
    font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" 
    font-weight="900" 
    font-size="46" 
    fill="#04AA6D"
    letter-spacing="3"
  >NEXTSEM</text>
</svg>
