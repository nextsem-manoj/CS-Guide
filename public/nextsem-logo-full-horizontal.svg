<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 120" width="540" height="120">
  <defs>
    <linearGradient id="nsHCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1328"/>
      <stop offset="100%" stop-color="#060c18"/>
    </linearGradient>
    <linearGradient id="nsHGreenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#04AA6D"/>
    </linearGradient>
    <filter id="nsHGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#04AA6D" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Left Icon Emblem Container -->
  <rect x="10" y="10" width="100" height="100" rx="24" fill="url(#nsHCardGrad)" stroke="#04AA6D" stroke-width="3" stroke-opacity="0.9"/>
  <rect x="16" y="16" width="88" height="88" rx="18" fill="none" stroke="#10b981" stroke-width="1" stroke-opacity="0.3"/>

  <!-- BOLD N in Icon -->
  <path d="M 28 85 V 35 L 56 85 V 35" fill="none" stroke="url(#nsHGreenGrad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" filter="url(#nsHGlow)"/>

  <!-- BOLD S in Icon -->
  <path d="M 94 44 C 94 34, 68 34, 68 47 C 68 60, 94 60, 94 74 C 94 86, 68 86, 68 76" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round"/>

  <!-- Full Wordmark: Nextsem -->
  <!-- "Next" in Pure White -->
  <text x="135" y="75" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="54" font-weight="900" fill="#FFFFFF" letter-spacing="-1">Next</text>
  
  <!-- "sem" in Emerald Green -->
  <text x="262" y="75" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="54" font-weight="900" fill="#04AA6D" letter-spacing="-1">sem</text>

  <!-- Subtitle Tagline -->
  <text x="138" y="100" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13" font-weight="700" fill="#94a3b8" letter-spacing="2">100% FREE DEV BOOTCAMP</text>
</svg>
