<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060c18"/>
      <stop offset="100%" stop-color="#0d172e"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#04AA6D"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="900" height="520" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2"/>

  <!-- Subtle Grid Pattern -->
  <g opacity="0.07" stroke="#94a3b8" stroke-width="1">
    <line x1="50" y1="0" x2="50" y2="520"/>
    <line x1="150" y1="0" x2="150" y2="520"/>
    <line x1="250" y1="0" x2="250" y2="520"/>
    <line x1="350" y1="0" x2="350" y2="520"/>
    <line x1="450" y1="0" x2="450" y2="520"/>
    <line x1="550" y1="0" x2="550" y2="520"/>
    <line x1="650" y1="0" x2="650" y2="520"/>
    <line x1="750" y1="0" x2="750" y2="520"/>
    <line x1="850" y1="0" x2="850" y2="520"/>
    <line x1="0" y1="80" x2="900" y2="80"/>
    <line x1="0" y1="160" x2="900" y2="160"/>
    <line x1="0" y1="240" x2="900" y2="240"/>
    <line x1="0" y1="320" x2="900" y2="320"/>
    <line x1="0" y1="400" x2="900" y2="400"/>
    <line x1="0" y1="480" x2="900" y2="480"/>
  </g>

  <!-- Top Title Header -->
  <text x="450" y="42" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="900" text-anchor="middle" letter-spacing="0.5">
    OPERATING SYSTEM ARCHITECTURE (4-LAYER STACK)
  </text>
  <text x="450" y="64" fill="#04AA6D" font-family="monospace" font-size="12" font-weight="700" text-anchor="middle">
    User Space ➔ System Call API ➔ Kernel Space ➔ Physical Hardware
  </text>

  <!-- LAYER 1: USERS & APPLICATION SOFTWARE -->
  <g transform="translate(50, 85)">
    <rect width="800" height="75" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6 3"/>
    <rect x="15" y="10" width="130" height="22" rx="6" fill="#0284c7" opacity="0.25"/>
    <text x="80" y="25" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="800" text-anchor="middle">LAYER 1 • USER SPACE</text>

    <!-- App Badges -->
    <g transform="translate(160, 16)">
      <!-- Chrome -->
      <rect x="0" y="0" width="125" height="42" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="62" y="25" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">🌐 Web Browser</text>

      <!-- VS Code / IDE -->
      <rect x="140" y="0" width="125" height="42" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="202" y="25" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">💻 Code Editor</text>

      <!-- Games / Media -->
      <rect x="280" y="0" width="125" height="42" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="342" y="25" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">🎮 Games & Apps</text>

      <!-- Windows Terminal -->
      <rect x="420" y="0" width="180" height="42" rx="8" fill="#1e293b" stroke="#04AA6D" stroke-width="1.5"/>
      <text x="510" y="25" fill="#04AA6D" font-family="monospace" font-size="12" font-weight="800" text-anchor="middle">🪟 Windows CMD / CLI</text>
    </g>
  </g>

  <!-- Downward Arrow 1 -->
  <g transform="translate(450, 166)" stroke="#38bdf8" stroke-width="2" fill="none">
    <path d="M 0 0 L 0 12 M -4 8 L 0 12 L 4 8"/>
    <text x="80" y="9" fill="#94a3b8" font-family="monospace" font-size="10" stroke="none" text-anchor="middle">System Calls (API: Win32 / POSIX)</text>
  </g>

  <!-- LAYER 2: SHELL & USER INTERFACE -->
  <g transform="translate(50, 185)">
    <rect width="800" height="65" rx="12" fill="#0d1b2a" stroke="#a855f7" stroke-width="1.5"/>
    <rect x="15" y="10" width="130" height="22" rx="6" fill="#8b5cf6" opacity="0.25"/>
    <text x="80" y="25" fill="#c084fc" font-family="monospace" font-size="11" font-weight="800" text-anchor="middle">LAYER 2 • SHELL / UI</text>

    <!-- Shell Components -->
    <g transform="translate(170, 12)">
      <rect x="0" y="0" width="180" height="40" rx="8" fill="#1e1b4b" stroke="#6366f1" stroke-width="1"/>
      <text x="90" y="24" fill="#e0e7ff" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">🪟 GUI (Desktop / Explorer)</text>

      <rect x="200" y="0" width="190" height="40" rx="8" fill="#1e1b4b" stroke="#6366f1" stroke-width="1"/>
      <text x="295" y="24" fill="#e0e7ff" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">⚡ Command Shell (cmd / bash)</text>

      <rect x="410" y="0" width="180" height="40" rx="8" fill="#1e1b4b" stroke="#6366f1" stroke-width="1"/>
      <text x="500" y="24" fill="#e0e7ff" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">🛡️ Superuser / Security Access</text>
    </g>
  </g>

  <!-- Downward Arrow 2 -->
  <g transform="translate(450, 256)" stroke="#a855f7" stroke-width="2" fill="none">
    <path d="M 0 0 L 0 12 M -4 8 L 0 12 L 4 8"/>
    <text x="80" y="9" fill="#94a3b8" font-family="monospace" font-size="10" stroke="none" text-anchor="middle">Kernel Privilege Ring 0 Transition</text>
  </g>

  <!-- LAYER 3: KERNEL SUBSYSTEMS (THE BRAIN) -->
  <g transform="translate(50, 275)">
    <rect width="800" height="110" rx="12" fill="#042f2e" stroke="#10b981" stroke-width="2" filter="url(#glow)"/>
    <rect width="800" height="110" rx="12" fill="#042f2e" stroke="#10b981" stroke-width="2"/>
    
    <rect x="15" y="10" width="130" height="22" rx="6" fill="#059669" opacity="0.3"/>
    <text x="80" y="25" fill="#34d399" font-family="monospace" font-size="11" font-weight="800" text-anchor="middle">LAYER 3 • KERNEL</text>

    <!-- Subsystems Grid -->
    <g transform="translate(160, 14)">
      <!-- Process Manager -->
      <rect x="0" y="0" width="140" height="80" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
      <text x="70" y="26" fill="#6ee7b7" font-family="sans-serif" font-size="12" font-weight="900" text-anchor="middle">⚙️ Process Mgmt</text>
      <text x="70" y="46" fill="#cbd5e1" font-family="sans-serif" font-size="10" text-anchor="middle">• CPU Scheduling</text>
      <text x="70" y="62" fill="#cbd5e1" font-family="sans-serif" font-size="10" text-anchor="middle">• Threads & IPC</text>

      <!-- Memory Manager -->
      <rect x="155" y="0" width="140" height="80" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
      <text x="225" y="26" fill="#6ee7b7" font-family="sans-serif" font-size="12" font-weight="900" text-anchor="middle">🧠 Memory Mgmt</text>
      <text x="225" y="46" fill="#cbd5e1" font-family="sans-serif" font-size="10" text-anchor="middle">• RAM Allocation</text>
      <text x="225" y="62" fill="#cbd5e1" font-family="sans-serif" font-size="10" text-anchor="middle">• Virtual Paging</text>

      <!-- File System -->
      <rect x="310" y="0" width="140" height="80" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
      <text x="380" y="26" fill="#6ee7b7" font-family="sans-serif" font-size="12" font-weight="900" text-anchor="middle">📁 File Systems</text>
      <text x="380" y="46" fill="#cbd5e1" font-family="sans-serif" font-size="10" text-anchor="middle">• NTFS / ext4 / FAT</text>
      <text x="380" y="62" fill="#cbd5e1" font-family="sans-serif" font-size="10" text-anchor="middle">• Directory Trees</text>

      <!-- Device Drivers -->
      <rect x="465" y="0" width="145" height="80" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
      <text x="537" y="26" fill="#6ee7b7" font-family="sans-serif" font-size="12" font-weight="900" text-anchor="middle">🔌 Device Drivers</text>
      <text x="537" y="46" fill="#cbd5e1" font-family="sans-serif" font-size="10" text-anchor="middle">• I/O Control (IOCS)</text>
      <text x="537" y="62" fill="#cbd5e1" font-family="sans-serif" font-size="10" text-anchor="middle">• Plug & Play (PnP)</text>
    </g>
  </g>

  <!-- Downward Arrow 3 -->
  <g transform="translate(450, 391)" stroke="#10b981" stroke-width="2" fill="none">
    <path d="M 0 0 L 0 12 M -4 8 L 0 12 L 4 8"/>
    <text x="80" y="9" fill="#94a3b8" font-family="monospace" font-size="10" stroke="none" text-anchor="middle">Hardware Bus & Interrupt Lines</text>
  </g>

  <!-- LAYER 4: PHYSICAL HARDWARE -->
  <g transform="translate(50, 410)">
    <rect width="800" height="85" rx="12" fill="#18181b" stroke="#f59e0b" stroke-width="1.5"/>
    <rect x="15" y="10" width="130" height="22" rx="6" fill="#d97706" opacity="0.25"/>
    <text x="80" y="25" fill="#fbbf24" font-family="monospace" font-size="11" font-weight="800" text-anchor="middle">LAYER 4 • HARDWARE</text>

    <!-- Hardware Modules -->
    <g transform="translate(160, 16)">
      <!-- CPU -->
      <rect x="0" y="0" width="135" height="52" rx="8" fill="#27272a" stroke="#52525b" stroke-width="1"/>
      <text x="67" y="24" fill="#fde047" font-family="sans-serif" font-size="11" font-weight="900" text-anchor="middle">🔲 Multi-Core CPU</text>
      <text x="67" y="42" fill="#94a3b8" font-family="monospace" font-size="10" text-anchor="middle">CU + ALU + Registers</text>

      <!-- RAM -->
      <rect x="150" y="0" width="135" height="52" rx="8" fill="#27272a" stroke="#52525b" stroke-width="1"/>
      <text x="217" y="24" fill="#fde047" font-family="sans-serif" font-size="11" font-weight="900" text-anchor="middle">⚡ Main Memory</text>
      <text x="217" y="42" fill="#94a3b8" font-family="monospace" font-size="10" text-anchor="middle">DDR4 / DDR5 RAM</text>

      <!-- Disks / SSD -->
      <rect x="300" y="0" width="140" height="52" rx="8" fill="#27272a" stroke="#52525b" stroke-width="1"/>
      <text x="370" y="24" fill="#fde047" font-family="sans-serif" font-size="11" font-weight="900" text-anchor="middle">💾 Mass Storage</text>
      <text x="370" y="42" fill="#94a3b8" font-family="monospace" font-size="10" text-anchor="middle">NVMe SSD / HDD</text>

      <!-- Peripherals & NIC -->
      <rect x="455" y="0" width="155" height="52" rx="8" fill="#27272a" stroke="#52525b" stroke-width="1"/>
      <text x="532" y="24" fill="#fde047" font-family="sans-serif" font-size="11" font-weight="900" text-anchor="middle">🌐 I/O & Network NIC</text>
      <text x="532" y="42" fill="#94a3b8" font-family="monospace" font-size="10" text-anchor="middle">Display, Keyboard, Wi-Fi</text>
    </g>
  </g>

  <!-- Watermark & Author Tag -->
  <text x="880" y="505" fill="#64748b" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="end">
    Nextsem Academy • Er. Manoj Kumar
  </text>
</svg>
