<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <linearGradient id="nsCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1328"/>
      <stop offset="100%" stop-color="#060c18"/>
    </linearGradient>
    <linearGradient id="nsGreenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#04AA6D"/>
    </linearGradient>
    <filter id="nsGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#04AA6D" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Container Box with Rounded Corners (Electric Blue Border matching official logo) -->
  <rect x="4" y="4" width="152" height="152" rx="36" fill="url(#nsCardGrad)" stroke="#2563eb" stroke-width="5" stroke-opacity="0.95"/>

  <!-- Inner Ambient Glow Layer -->
  <rect x="12" y="12" width="136" height="136" rx="28" fill="none" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.25"/>

  <!-- BOLD N (Emerald Green with Glow) -->
  <path d="M 28 120 V 40 L 72 120 V 40" 
        fill="none" 
        stroke="url(#nsGreenGrad)" 
        stroke-width="18" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#nsGlow)"/>

  <!-- BOLD S (Crisp Pure White) -->
  <path d="M 132 54 C 132 38, 92 38, 92 58 C 92 80, 132 80, 132 102 C 132 120, 92 120, 92 104" 
        fill="none" 
        stroke="#FFFFFF" 
        stroke-width="18" 
        stroke-linecap="round"/>
</svg>
