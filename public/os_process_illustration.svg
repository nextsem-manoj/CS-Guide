<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060c18"/>
      <stop offset="100%" stop-color="#0b1329"/>
    </linearGradient>
    <filter id="boxGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="450" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2"/>

  <!-- Title Header -->
  <text x="450" y="38" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="900" text-anchor="middle">
    PROCESS STATE TRANSITION &amp; CPU SCHEDULING LIFECYCLE
  </text>
  <text x="450" y="58" fill="#06b6d4" font-family="monospace" font-size="12" font-weight="700" text-anchor="middle">
    5 Fundamental States of a Program in Execution (Process Control Block - PCB)
  </text>

  <!-- STATE 1: NEW -->
  <g transform="translate(60, 160)">
    <rect width="130" height="90" rx="14" fill="#0f172a" stroke="#94a3b8" stroke-width="2"/>
    <text x="65" y="40" fill="#f8fafc" font-family="sans-serif" font-size="16" font-weight="900" text-anchor="middle">1. NEW</text>
    <text x="65" y="62" fill="#94a3b8" font-family="monospace" font-size="10" text-anchor="middle">Program being</text>
    <text x="65" y="76" fill="#94a3b8" font-family="monospace" font-size="10" text-anchor="middle">created on disk</text>
  </g>

  <!-- Arrow NEW -> READY (Admitted) -->
  <g stroke="#38bdf8" stroke-width="2" fill="none">
    <path d="M 190 205 L 260 205"/>
    <polygon points="260,205 250,200 250,210" fill="#38bdf8"/>
    <text x="225" y="195" fill="#38bdf8" font-family="monospace" font-size="10" font-weight="700" text-anchor="middle" stroke="none">Admitted</text>
  </g>

  <!-- STATE 2: READY QUEUE -->
  <g transform="translate(270, 160)">
    <rect width="150" height="90" rx="14" fill="#042f2e" stroke="#10b981" stroke-width="2" filter="url(#boxGlow)"/>
    <rect width="150" height="90" rx="14" fill="#042f2e" stroke="#10b981" stroke-width="2"/>
    <text x="75" y="38" fill="#34d399" font-family="sans-serif" font-size="16" font-weight="900" text-anchor="middle">2. READY</text>
    <text x="75" y="58" fill="#a7f3d0" font-family="monospace" font-size="10" text-anchor="middle">In RAM Memory</text>
    <text x="75" y="72" fill="#a7f3d0" font-family="monospace" font-size="10" text-anchor="middle">Waiting for CPU slice</text>
  </g>

  <!-- Arrow READY -> RUNNING (Scheduler Dispatch) -->
  <g stroke="#10b981" stroke-width="2" fill="none">
    <path d="M 420 190 L 510 190"/>
    <polygon points="510,190 500,185 500,195" fill="#10b981"/>
    <text x="465" y="180" fill="#10b981" font-family="monospace" font-size="10" font-weight="700" text-anchor="middle" stroke="none">Scheduler Dispatch</text>
  </g>

  <!-- Arrow RUNNING -> READY (Interrupt / Time-slice expired) -->
  <g stroke="#f59e0b" stroke-width="2" fill="none">
    <path d="M 510 220 L 420 220"/>
    <polygon points="420,220 430,215 430,225" fill="#f59e0b"/>
    <text x="465" y="238" fill="#fbbf24" font-family="monospace" font-size="10" font-weight="700" text-anchor="middle" stroke="none">Interrupt (Quantum)</text>
  </g>

  <!-- STATE 3: RUNNING (CPU) -->
  <g transform="translate(520, 150)">
    <rect width="160" height="110" rx="14" fill="#1e1b4b" stroke="#818cf8" stroke-width="2" filter="url(#boxGlow)"/>
    <rect width="160" height="110" rx="14" fill="#1e1b4b" stroke="#818cf8" stroke-width="2"/>
    <text x="80" y="38" fill="#a5b4fc" font-family="sans-serif" font-size="16" font-weight="900" text-anchor="middle">3. RUNNING</text>
    <text x="80" y="62" fill="#e0e7ff" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">⚡ CPU Executing</text>
    <text x="80" y="80" fill="#cbd5e1" font-family="monospace" font-size="10" text-anchor="middle">Instructions in Core</text>
    <text x="80" y="94" fill="#38bdf8" font-family="monospace" font-size="9" text-anchor="middle">(PC + ALU Active)</text>
  </g>

  <!-- Arrow RUNNING -> TERMINATED (Exit) -->
  <g stroke="#38bdf8" stroke-width="2" fill="none">
    <path d="M 680 205 L 740 205"/>
    <polygon points="740,205 730,200 730,210" fill="#38bdf8"/>
    <text x="710" y="195" fill="#38bdf8" font-family="monospace" font-size="10" font-weight="700" text-anchor="middle" stroke="none">Exit / End</text>
  </g>

  <!-- STATE 4: TERMINATED -->
  <g transform="translate(750, 160)">
    <rect width="115" height="90" rx="14" fill="#18181b" stroke="#e11d48" stroke-width="2"/>
    <text x="57" y="40" fill="#fda4af" font-family="sans-serif" font-size="14" font-weight="900" text-anchor="middle">5. TERMINATED</text>
    <text x="57" y="62" fill="#94a3b8" font-family="monospace" font-size="10" text-anchor="middle">De-allocated</text>
    <text x="57" y="76" fill="#94a3b8" font-family="monospace" font-size="10" text-anchor="middle">Resources Freed</text>
  </g>

  <!-- STATE 5: WAITING / BLOCKED (Lower Box) -->
  <g transform="translate(390, 320)">
    <rect width="180" height="90" rx="14" fill="#311317" stroke="#f43f5e" stroke-width="2"/>
    <text x="90" y="38" fill="#fda4af" font-family="sans-serif" font-size="15" font-weight="900" text-anchor="middle">4. WAITING (BLOCKED)</text>
    <text x="90" y="58" fill="#fecdd3" font-family="monospace" font-size="10" text-anchor="middle">Waiting for I/O event</text>
    <text x="90" y="72" fill="#fecdd3" font-family="monospace" font-size="10" text-anchor="middle">or Disk Read/Write</text>
  </g>

  <!-- Arrow RUNNING -> WAITING (I/O or Event Wait) -->
  <g stroke="#f43f5e" stroke-width="2" fill="none">
    <path d="M 600 260 L 600 365 L 570 365"/>
    <polygon points="570,365 580,360 580,370" fill="#f43f5e"/>
    <text x="645" y="315" fill="#fda4af" font-family="monospace" font-size="10" font-weight="700" text-anchor="middle" stroke="none">I/O or Event Wait</text>
  </g>

  <!-- Arrow WAITING -> READY (I/O Completion) -->
  <g stroke="#10b981" stroke-width="2" fill="none">
    <path d="M 390 365 L 345 365 L 345 250"/>
    <polygon points="345,250 340,260 350,260" fill="#10b981"/>
    <text x="310" y="315" fill="#34d399" font-family="monospace" font-size="10" font-weight="700" text-anchor="middle" stroke="none">I/O Done</text>
  </g>

  <!-- Footer Tag -->
  <text x="870" y="435" fill="#64748b" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="end">
    Nextsem Academy • Er. Manoj Kumar
  </text>
</svg>
