<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 72" width="280" height="72">
  <defs>
    <!-- Background Gradient for the NS Icon Box -->
    <linearGradient id="badgeBoxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1328"/>
      <stop offset="100%" stop-color="#060c18"/>
    </linearGradient>

    <!-- Glowing Emerald Gradient for the N -->
    <linearGradient id="badgeGreenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#04AA6D"/>
    </linearGradient>

    <!-- N Glow Filter -->
    <filter id="badgeNGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#04AA6D" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Outer Dark Pill Container (as seen in user screenshot) -->
  <rect x="2" y="2" width="276" height="68" rx="22" fill="#0d1117" stroke="#1f293d" stroke-width="2"/>

  <!-- Left Icon Box with Electric Blue Border -->
  <rect x="8" y="8" width="56" height="56" rx="15" fill="url(#badgeBoxGrad)" stroke="#2563eb" stroke-width="2.5" stroke-opacity="0.95"/>
  <rect x="11" y="11" width="50" height="50" rx="12" fill="none" stroke="#38bdf8" stroke-width="0.8" stroke-opacity="0.3"/>

  <!-- BOLD N in Emerald Green -->
  <path d="M 18 48 V 20 L 32 48 V 20" 
        fill="none" 
        stroke="url(#badgeGreenGrad)" 
        stroke-width="6.5" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        filter="url(#badgeNGlow)"/>

  <!-- BOLD S in Pure White -->
  <path d="M 52 25 C 52 19, 39 19, 39 27 C 39 34, 52 34, 52 42 C 52 50, 39 50, 39 44" 
        fill="none" 
        stroke="#FFFFFF" 
        stroke-width="6.5" 
        stroke-linecap="round"/>

  <!-- Wordmark: "Academy" in Crisp Pure White (matching user screenshot) -->
  <text x="76" y="44" 
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" 
        font-size="28" 
        font-weight="900" 
        fill="#FFFFFF" 
        letter-spacing="-0.5">Academy</text>
</svg>
